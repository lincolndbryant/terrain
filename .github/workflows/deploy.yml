name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build playground
        run: pnpm --filter @ourizon/playground build
        env:
          VITE_BASE_PATH: /terrain/

      - name: Build gizmo-golf
        run: pnpm --filter @ourizon/gizmo-golf build
        env:
          VITE_BASE_PATH: /terrain/golf/

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r apps/playground/dist/. _site/
          mkdir -p _site/golf
          cp -r apps/gizmo-golf/dist/. _site/golf/

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
